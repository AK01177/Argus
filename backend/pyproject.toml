[tool.ruff]
# Ignore B008: Do not perform function call `Depends` in argument defaults
# This is a standard pattern in FastAPI
lint.ignore = ["B008"]
exclude = ["migrations"]

[tool.ruff.lint.per-file-ignores]
# Ignore unused imports in models/__init__.py since they are used by Alembic
"app/models/__init__.py" = ["F401"]
"migrations/env.py" = ["F401", "E402"]
